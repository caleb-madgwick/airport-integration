<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 432" width="1120" height="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Airport customer integration architecture</title>
  <desc id="desc">Customer data sources feed customer-specific adapters, which produce a shared canonical model. Shared validation checks each record and its relationships to other records, then sends it to exactly one outcome: accepted for the dispatch platform, needs review, or rejected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 650; fill: #1f2328; }
    .zone { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .col { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; fill: #59636e; }
    .h { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 11.5px; fill: #59636e; }
    .small { font-size: 11.5px; fill: #1f2328; }
    .step { font-size: 12px; font-weight: 600; fill: #0969da; }
    .note { font-size: 11px; fill: #59636e; }
    .group { font-size: 12.5px; font-weight: 650; fill: #1f2328; }
    .cfg { font-size: 11.5px; fill: #59636e; }
    .outcome { font-size: 11.5px; font-weight: 600; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .core { fill: #ffffff; stroke: #0969da; stroke-width: 1.4; }
    .pill { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .flow { stroke: #59636e; stroke-width: 1.4; fill: none; }
  </style>

  <rect width="1120" height="432" rx="14" fill="#ffffff"/>
  <text x="16" y="34" class="title">Airport customer integration architecture</text>
  <text x="1104" y="34" class="note" text-anchor="end">Synthetic data · fictional customers</text>

  <!-- Zones -->
  <rect x="12" y="52" width="412" height="368" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
  <rect x="440" y="52" width="668" height="368" rx="12" fill="#f3f8ff" stroke="#c8e1ff"/>
  <text x="28" y="76" class="zone" fill="#59636e">CUSTOMER-SPECIFIC  ·  ADDED PER CUSTOMER</text>
  <text x="456" y="76" class="zone" fill="#0969da">SHARED PLATFORM  ·  WRITTEN ONCE</text>

  <text x="28" y="102" class="col">DATA SOURCES</text>
  <text x="236" y="102" class="col">ADAPTERS</text>
  <text x="456" y="102" class="col">CANONICAL MODEL</text>
  <text x="676" y="102" class="col">VALIDATION</text>
  <text x="932" y="102" class="col">OUTCOMES</text>

  <!-- Customer groups: everything onboarding a customer adds -->
  <rect x="20" y="112" width="396" height="172" rx="10" fill="none" stroke="#bcc4cd" stroke-width="1.2"/>
  <text x="32" y="131"><tspan class="group">Kestrel Ground Handling</tspan><tspan class="sub" dx="8">SYD</tspan></text>
  <rect x="28" y="140" width="172" height="52" rx="8" class="box"/>
  <text x="40" y="162" class="h">Flight REST API</text>
  <text x="40" y="180" class="sub">nested JSON</text>
  <rect x="236" y="140" width="172" height="52" rx="8" class="box"/>
  <text x="248" y="162" class="mono">kestrel_flight()</text>
  <text x="248" y="180" class="sub">status codes → canonical</text>
  <rect x="28" y="200" width="172" height="52" rx="8" class="box"/>
  <text x="40" y="222" class="h">Baggage CSV export</text>
  <text x="40" y="240" class="sub">local time, no offset</text>
  <rect x="236" y="200" width="172" height="52" rx="8" class="box"/>
  <text x="248" y="222" class="mono">kestrel_bag()</text>
  <text x="248" y="240" class="sub">local time → UTC</text>
  <text x="32" y="272" class="cfg"><tspan font-weight="600">Config:</tspan> timezone Australia/Sydney · status code map</text>

  <rect x="20" y="296" width="396" height="112" rx="10" fill="none" stroke="#bcc4cd" stroke-width="1.2"/>
  <text x="32" y="315"><tspan class="group">Banksia Airside Services</tspan><tspan class="sub" dx="8">PER</tspan></text>
  <rect x="28" y="324" width="172" height="52" rx="8" class="box"/>
  <text x="40" y="346" class="h">Flight API</text>
  <text x="40" y="364" class="sub">flat JSON, ICAO codes</text>
  <rect x="236" y="324" width="172" height="52" rx="8" class="box"/>
  <text x="248" y="346" class="mono">banksia_flight()</text>
  <text x="248" y="364" class="sub">ICAO → IATA</text>
  <text x="32" y="396" class="cfg"><tspan font-weight="600">Config:</tspan> timezone Australia/Perth · status code map</text>

  <line x1="200" y1="166" x2="234" y2="166" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="226" x2="234" y2="226" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="350" x2="234" y2="350" class="flow" marker-end="url(#arrow)"/>
  <line x1="408" y1="166" x2="454" y2="166" class="flow" marker-end="url(#arrow)"/>
  <line x1="408" y1="226" x2="454" y2="226" class="flow" marker-end="url(#arrow)"/>
  <line x1="408" y1="350" x2="454" y2="350" class="flow" marker-end="url(#arrow)"/>

  <!-- Canonical model -->
  <rect x="456" y="140" width="180" height="236" rx="10" class="core"/>
  <rect x="468" y="154" width="156" height="26" rx="6" class="pill"/>
  <text x="480" y="172" class="mono" style="font-size:12.5px">Flight</text>
  <rect x="468" y="188" width="156" height="26" rx="6" class="pill"/>
  <text x="480" y="206" class="mono" style="font-size:12.5px">BaggageTransfer</text>
  <text x="468" y="246" class="small">• UTC timestamps</text>
  <text x="468" y="267" class="small">• IATA airport codes</text>
  <text x="468" y="288" class="small">• keyed by flight number</text>
  <text x="479" y="304" class="small">+ local operating date</text>

  <line x1="636" y1="258" x2="674" y2="258" class="flow" style="stroke-width:1.8" marker-end="url(#arrow)"/>

  <!-- Validation -->
  <rect x="676" y="140" width="164" height="236" rx="10" class="core"/>
  <text x="688" y="166" class="step">1  Record rules</text>
  <text x="688" y="185" class="small">required fields, UTC,</text>
  <text x="688" y="202" class="small">known codes, bag tag</text>
  <line x1="688" y1="221" x2="828" y2="221" stroke="#c8e1ff"/>
  <text x="688" y="245" class="step">2  Cross-record</text>
  <text x="688" y="264" class="small">duplicates, conflicts</text>
  <text x="688" y="281" class="small">bag → operating flight</text>
  <text x="688" y="360" class="note">one outcome per record</text>

  <!-- Outcomes -->
  <line x1="840" y1="172" x2="930" y2="172" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="886" y="164" class="outcome" text-anchor="middle" fill="#1a7f37">accepted</text>
  <line x1="840" y1="258" x2="930" y2="258" stroke="#9a6700" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <text x="886" y="250" class="outcome" text-anchor="middle" fill="#9a6700">needs review</text>
  <line x1="840" y1="344" x2="930" y2="344" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="886" y="336" class="outcome" text-anchor="middle" fill="#cf222e">rejected</text>

  <rect x="932" y="140" width="164" height="64" rx="8" class="box"/>
  <rect x="932" y="140" width="5" height="64" rx="2" fill="#1a7f37"/>
  <text x="948" y="175" class="h">Dispatch platform</text>
  <text x="948" y="193" class="sub">trusted records only</text>

  <rect x="932" y="226" width="164" height="64" rx="8" class="box"/>
  <rect x="932" y="226" width="5" height="64" rx="2" fill="#9a6700"/>
  <text x="948" y="261" class="h">Ops review queue</text>
  <text x="948" y="279" class="sub">held for a person</text>

  <rect x="932" y="312" width="164" height="64" rx="8" class="box"/>
  <rect x="932" y="312" width="5" height="64" rx="2" fill="#cf222e"/>
  <text x="948" y="347" class="h">Error report</text>
  <text x="948" y="365" class="sub">errors + raw record</text>
  <text x="932" y="394" class="note">Prototype prints each outcome;</text>
  <text x="932" y="408" class="note">destinations are not built.</text>

</svg>
