<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="1120" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Airport customer integration architecture</title>
  <desc id="desc">Customer data sources feed customer-specific adapters, which produce a shared canonical model. Validation sends each record to exactly one outcome: accepted for the dispatch platform, needs review, or rejected.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
  </defs>
  <style>
    .title { font-size: 17px; font-weight: 650; fill: #1f2328; }
    .zone { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; }
    .col { font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; fill: #59636e; }
    .h { font-size: 14px; font-weight: 600; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #1f2328; }
    .sub { font-size: 11.5px; fill: #59636e; }
    .small { font-size: 11.5px; fill: #1f2328; }
    .step { font-size: 12px; font-weight: 600; fill: #0969da; }
    .note { font-size: 11px; fill: #59636e; }
    .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .core { fill: #ffffff; stroke: #0969da; stroke-width: 1.4; }
    .pill { fill: #ddf4ff; stroke: #54aeff; stroke-width: 1; }
    .dashed { stroke-dasharray: 5 4; }
    .flow { stroke: #59636e; stroke-width: 1.4; fill: none; }
  </style>

  <rect width="1120" height="510" rx="14" fill="#ffffff"/>
  <text x="16" y="34" class="title">Airport customer integration architecture</text>

  <!-- Zones -->
  <rect x="12" y="52" width="412" height="404" rx="12" fill="#f6f8fa" stroke="#d8dee4"/>
  <rect x="440" y="52" width="668" height="404" rx="12" fill="#f3f8ff" stroke="#c8e1ff"/>
  <text x="28" y="76" class="zone" fill="#59636e">CUSTOMER-SPECIFIC</text>
  <text x="456" y="76" class="zone" fill="#0969da">SHARED PLATFORM CORE  ·  WRITTEN ONCE</text>

  <text x="24" y="102" class="col">DATA SOURCES</text>
  <text x="236" y="102" class="col">SOURCE ADAPTERS</text>
  <text x="456" y="102" class="col">CANONICAL MODEL</text>
  <text x="676" y="102" class="col">VALIDATION</text>
  <text x="932" y="102" class="col">OUTCOMES</text>

  <!-- Sources -->
  <rect x="24" y="114" width="176" height="54" rx="8" class="box"/>
  <text x="36" y="137" class="h">Flight REST API</text>
  <text x="36" y="156" class="sub">Kestrel · nested JSON, UTC</text>

  <rect x="24" y="213" width="176" height="54" rx="8" class="box"/>
  <text x="36" y="236" class="h">Baggage CSV export</text>
  <text x="36" y="255" class="sub">Kestrel · local time, no offset</text>

  <rect x="24" y="312" width="176" height="54" rx="8" class="box"/>
  <text x="36" y="335" class="h">Flight API</text>
  <text x="36" y="354" class="sub">Banksia · ICAO codes, offsets</text>

  <!-- Source -> adapter -->
  <line x1="200" y1="141" x2="234" y2="141" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="240" x2="234" y2="240" class="flow" marker-end="url(#arrow)"/>
  <line x1="200" y1="339" x2="234" y2="339" class="flow" marker-end="url(#arrow)"/>

  <!-- Adapters -->
  <rect x="236" y="114" width="174" height="54" rx="8" class="box"/>
  <text x="248" y="137" class="mono">kestrel_flight()</text>
  <text x="248" y="156" class="sub">status codes → canonical</text>

  <rect x="236" y="213" width="174" height="54" rx="8" class="box"/>
  <text x="248" y="236" class="mono">kestrel_bag()</text>
  <text x="248" y="255" class="sub">local time → UTC, DST-safe</text>

  <rect x="236" y="312" width="174" height="54" rx="8" class="box"/>
  <text x="248" y="335" class="mono">banksia_flight()</text>
  <text x="248" y="354" class="sub">ICAO → IATA, offset → UTC</text>

  <!-- Customer config -->
  <rect x="24" y="392" width="386" height="48" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="36" y="412" class="h" style="font-size:13px">Customer config + code mappings</text>
  <text x="36" y="430" class="sub">local timezone · status code maps · read by adapters</text>
  <line x1="323" y1="392" x2="323" y2="369" class="flow" marker-end="url(#arrow)"/>

  <!-- Adapter -> canonical -->
  <line x1="410" y1="141" x2="454" y2="141" class="flow" marker-end="url(#arrow)"/>
  <line x1="410" y1="240" x2="454" y2="240" class="flow" marker-end="url(#arrow)"/>
  <line x1="410" y1="339" x2="454" y2="339" class="flow" marker-end="url(#arrow)"/>

  <!-- Canonical model -->
  <rect x="456" y="114" width="180" height="252" rx="10" class="core"/>
  <rect x="468" y="128" width="156" height="26" rx="6" class="pill"/>
  <text x="480" y="146" class="mono" style="font-size:12.5px">Flight</text>
  <rect x="468" y="162" width="156" height="26" rx="6" class="pill"/>
  <text x="480" y="180" class="mono" style="font-size:12.5px">BaggageTransfer</text>
  <text x="468" y="228" class="small">• all timestamps in UTC</text>
  <text x="468" y="250" class="small">• IATA airport codes</text>
  <text x="468" y="272" class="small">• flight_key = carrier +</text>
  <text x="480" y="288" class="small">number + local date</text>
  <text x="468" y="310" class="small">• provenance on every</text>
  <text x="480" y="326" class="small">record (source_ref)</text>
  <text x="456" y="440" class="note">Shared reference data: airports (IATA, ICAO, IANA timezone).</text>

  <!-- Canonical -> validation -->
  <line x1="636" y1="240" x2="674" y2="240" class="flow" style="stroke-width:1.8" marker-end="url(#arrow)"/>

  <!-- Validation -->
  <rect x="676" y="114" width="164" height="252" rx="10" class="core"/>
  <text x="688" y="140" class="step">1  Record rules</text>
  <text x="688" y="160" class="small">required fields</text>
  <text x="688" y="177" class="small">timestamps in UTC</text>
  <text x="688" y="194" class="small">known airports</text>
  <text x="688" y="211" class="small">valid status, bag tag</text>
  <line x1="688" y1="230" x2="828" y2="230" stroke="#c8e1ff"/>
  <text x="688" y="254" class="step">2  Cross-source</text>
  <text x="688" y="274" class="small">bag's outbound flight</text>
  <text x="688" y="291" class="small">is known and not</text>
  <text x="688" y="308" class="small">cancelled</text>
  <text x="688" y="350" class="note">one outcome per record</text>

  <!-- Validation -> outcomes -->
  <line x1="840" y1="150" x2="930" y2="150" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="886" y="142" class="small" text-anchor="middle" style="fill:#1a7f37;font-weight:600">accepted</text>
  <line x1="840" y1="240" x2="930" y2="240" stroke="#9a6700" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  <text x="886" y="232" class="small" text-anchor="middle" style="fill:#9a6700;font-weight:600">needs review</text>
  <line x1="840" y1="330" x2="930" y2="330" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="886" y="322" class="small" text-anchor="middle" style="fill:#cf222e;font-weight:600">rejected</text>

  <!-- Outcomes -->
  <rect x="932" y="114" width="164" height="72" rx="8" class="box dashed"/>
  <rect x="932" y="114" width="5" height="72" rx="2" fill="#1a7f37"/>
  <text x="948" y="142" class="h">Dispatch platform</text>
  <text x="948" y="161" class="sub">hypothetical consumer;</text>
  <text x="948" y="176" class="sub">trusted records only</text>

  <rect x="932" y="204" width="164" height="72" rx="8" class="box dashed"/>
  <rect x="932" y="204" width="5" height="72" rx="2" fill="#9a6700"/>
  <text x="948" y="232" class="h">Ops review queue</text>
  <text x="948" y="251" class="sub">held with a reason;</text>
  <text x="948" y="266" class="sub">never auto-dispatched</text>

  <rect x="932" y="294" width="164" height="72" rx="8" class="box"/>
  <rect x="932" y="294" width="5" height="72" rx="2" fill="#cf222e"/>
  <text x="948" y="322" class="h">Error report</text>
  <text x="948" y="341" class="sub">errors + raw record +</text>
  <text x="948" y="356" class="sub">source reference</text>

  <text x="456" y="404" class="note">The prototype prints all three outcomes. Dispatch delivery, the review queue, deduplication,</text>
  <text x="456" y="420" class="note">ordering, retries and replay would be needed in production.</text>

  <!-- Legend -->
  <line x1="16" y1="484" x2="52" y2="484" class="flow"/>
  <text x="60" y="488" class="note">implemented in prototype</text>
  <line x1="218" y1="484" x2="254" y2="484" class="flow dashed"/>
  <text x="262" y="488" class="note">production design only</text>
  <text x="1104" y="488" class="note" text-anchor="end">All customers and data are fictional.</text>
</svg>
